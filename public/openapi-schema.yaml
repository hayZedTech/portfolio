            schema:
              $ref: '#/components/schemas/AdminStudentCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminStudentCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminStudentCreation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStudentCreation'
          description: ''
    patch:
      operationId: v1_admin_students_partial_update
      summary: Partially update a student
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminStudentCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminStudentCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminStudentCreation'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStudentCreation'
          description: ''
    delete:
      operationId: v1_admin_students_destroy
      summary: Delete a student
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/students/{student_id}/courses/:
    get:
      operationId: v1_admin_students_courses_list
      summary: List student's courses
      parameters:
      - in: query
        name: admission_year
        schema:
          type: integer
          enum:
          - 2010
          - 2011
          - 2012
          - 2013
          - 2014
          - 2015
          - 2016
          - 2017
          - 2018
          - 2019
          - 2020
          - 2021
          - 2022
          - 2023
          - 2024
          - 2025
          - 2026
        description: |-
          * `2010` - 2010
          * `2011` - 2011
          * `2012` - 2012
          * `2013` - 2013
          * `2014` - 2014
          * `2015` - 2015
          * `2016` - 2016
          * `2017` - 2017
          * `2018` - 2018
          * `2019` - 2019
          * `2020` - 2020
          * `2021` - 2021
          * `2022` - 2022
          * `2023` - 2023
          * `2024` - 2024
          * `2025` - 2025
          * `2026` - 2026
      - in: query
        name: is_primary
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - WITHDRAWN
        description: |-
          * `ACTIVE` - Active
          * `COMPLETED` - Completed
          * `WITHDRAWN` - Withdrawn
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentCourseList'
          description: ''
    post:
      operationId: v1_admin_students_courses_create
      summary: Add course to student
      parameters:
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCourse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentCourse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentCourse'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCourse'
          description: ''
  /api/v1/admin/students/{student_id}/courses/{id}/:
    get:
      operationId: v1_admin_students_courses_retrieve
      summary: Get student's course details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student course.
        required: true
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCourse'
          description: ''
    put:
      operationId: v1_admin_students_courses_update
      summary: Update student's course status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student course.
        required: true
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCourse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentCourse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentCourse'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCourse'
          description: ''
    patch:
      operationId: v1_admin_students_courses_partial_update
      summary: Partially update student's course
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student course.
        required: true
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStudentCourse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStudentCourse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStudentCourse'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCourse'
          description: ''
    delete:
      operationId: v1_admin_students_courses_destroy
      summary: Remove course from student
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student course.
        required: true
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/students/bulk_delete/:
    post:
      operationId: v1_admin_students_bulk_delete_create
      tags:
      - v1
      requestBody:
        content:
