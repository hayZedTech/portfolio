  /api/v1/admin/profile/:
    get:
      operationId: v1_admin_profile_retrieve
      description: Allows the logged-in admin/staff user to view and update their
        own profile.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: v1_admin_profile_partial_update
      description: Allows the logged-in admin/staff user to view and update their
        own profile.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/settings/:
    get:
      operationId: v1_admin_settings_retrieve
      description: |-
        Endpoint to load and update global system settings.
        Saves state in a json file system_settings.json.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_admin_settings_create
      description: |-
        Endpoint to load and update global system settings.
        Saves state in a json file system_settings.json.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: v1_admin_settings_update
      description: |-
        Endpoint to load and update global system settings.
        Saves state in a json file system_settings.json.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
