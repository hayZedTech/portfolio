          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentGroup'
        required: true
      security:
      - jwtAuth: []
