          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminStaff'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminStaff'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStaff'
          description: ''
  /api/v1/admin/staff/{id}/:
    get:
      operationId: v1_admin_staff_retrieve
      description: ViewSet to list, create, update, and delete Admin / Staff users.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
