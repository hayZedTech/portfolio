  /api/v1/admin/staff/titles/:
    get:
      operationId: v1_admin_staff_titles_retrieve
      description: ViewSet to list, create, update, and delete Admin / Staff users.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStaff'
          description: ''
  /api/v1/admin/students/:
    get:
      operationId: v1_admin_students_list
      summary: List all registered students
      parameters:
      - in: query
        name: is_industrial_training
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - GRADUATED
          - INACTIVE
          - SUSPENDED
          - WITHDRAWN
        description: |-
          * `ACTIVE` - Active
          * `GRADUATED` - Graduated
          * `SUSPENDED` - Suspended
          * `WITHDRAWN` - Withdrawn
          * `INACTIVE` - Inactive
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminStudentCreation'
          description: ''
    post:
      operationId: v1_admin_students_create
      summary: Onboard / Provision a new Student
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStudentCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminStudentCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminStudentCreation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStudentCreation'
          description: ''
  /api/v1/admin/students/{id}/:
