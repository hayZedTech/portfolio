openapi: 3.0.3
info:
  title: Stephotec Computer Technologies Ltd. Student API
  version: 1.0.0
  description: Production-ready backend for student onboarding and management.
paths:
  /api/v1/admin/dashboard-stats/:
    get:
      operationId: v1_admin_dashboard_stats_retrieve
      description: |-
        Returns aggregated counts and metrics for the admin dashboard instantly
        without loading hundreds of heavy student objects over the wire.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/groups/:
    get:
      operationId: v1_admin_groups_list
      description: Admin CRUD for student groups, plus student-facing list of own
        groups.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentGroup'
          description: ''
    post:
      operationId: v1_admin_groups_create
      description: Admin CRUD for student groups, plus student-facing list of own
        groups.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentGroup'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGroup'
          description: ''
  /api/v1/admin/groups/{id}/:
    get:
      operationId: v1_admin_groups_retrieve
      description: Admin CRUD for student groups, plus student-facing list of own
        groups.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGroup'
          description: ''
    put:
