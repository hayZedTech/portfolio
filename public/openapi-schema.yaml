        groups.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentGroup'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGroup'
          description: ''
  /api/v1/admin/groups/bulk-delete/:
    post:
      operationId: v1_admin_groups_bulk_delete_create
      description: Admin CRUD for student groups, plus student-facing list of own
        groups.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentGroup'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGroup'
          description: ''
  /api/v1/admin/groups/my-groups/:
    get:
      operationId: v1_admin_groups_my_groups_retrieve
      description: Returns all groups the current student belongs to.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGroup'
