        groups.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStudentGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStudentGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStudentGroup'
      security:
      - jwtAuth: []
