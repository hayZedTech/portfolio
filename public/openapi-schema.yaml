          description: ''
    put:
      operationId: v1_admin_staff_update
      description: ViewSet to list, create, update, and delete Admin / Staff users.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
