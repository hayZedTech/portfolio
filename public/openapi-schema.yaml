components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - LOGIN
      - LOGOUT
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `LOGIN` - Login
        * `LOGOUT` - Logout
    AdminAlert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        alert_type:
          $ref: '#/components/schemas/AlertTypeEnum'
        title:
          type: string
          maxLength: 255
        message:
          type: string
        triggered_by:
          type: integer
        triggered_by_name:
          type: string
          readOnly: true
        triggered_by_username:
          type: string
          readOnly: true
        related_object_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        is_read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - alert_type
      - created_at
      - id
      - message
      - title
      - triggered_by
      - triggered_by_name
      - triggered_by_username
    AdminStaff:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        phone:
          type: string
        job_title:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_superuser:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        status:
          $ref: '#/components/schemas/Status79aEnum'
        temporary_password:
          type: string
          readOnly: true
        profile_picture_url:
          type: string
